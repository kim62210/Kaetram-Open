services:
  kaetram:
    build:
      context: .
      dockerfile: Dockerfile
    image: kaetram:latest
    container_name: kaetram
    restart: unless-stopped
    # config.ts:95가 dotenv.load({path: '../../.env', defaults: '../../.env.defaults'})
    # 로 .env 파일을 직접 읽으므로 서버 설정은 호스트 .env를 마운트한다.
    # sirv(클라이언트)는 process.env.HOST를 직접 읽으므로 환경변수로 0.0.0.0 강제.
    environment:
      HOST: '0.0.0.0'
    volumes:
      - ./.env:/app/.env:ro
    networks:
      - infra_default
    labels:
      - "com.brian-dev.service=kaetram"
      - "com.brian-dev.domain=kaetram.brian-dev.cloud"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  infra_default:
    external: true
